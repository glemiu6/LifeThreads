paths:
  /api/users:
    get:
      tags: [Users]
      summary: Get all users
      responses:
        '200':
          description: List of users
        '404':
          description: No users found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundError'

  /api/users/search:
    get:
      tags: [Users]
      summary: Search users by keywords
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of matching users
        '400':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserValidationError'
        '404':
          description: No users found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundError'

  /api/users/auth/register:
    post:
      tags: [Users]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                avatar:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserValidationError'

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get current user info
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Current user info
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundError'
    put:
      tags: [Users]
      summary: Update current user info
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                bio:
                  type: string
                avatar:
                  type: string
      responses:
        '200':
          description: User updated successfully
        '400':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserValidationError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundError'
    delete:
      tags: [Users]
      summary: Delete user account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User deleted successfully
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserForbiddenError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundError'

  

  /api/users/{id}/profile:
    get:
      tags: [Users]
      summary: Get public profile of a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Public profile
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundError'

  /api/users/{id}/following:
    get:
      tags: [Users]
      summary: Get list of users this user is following
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of following
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundError'

  /api/users/{id}/followers:
    get:
      tags: [Users]
      summary: Get list of followers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of followers
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundError'

  /api/users/{id}/follow:
    post:
      tags: [Users]
      summary: Follow a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                followingId:
                  type: integer
      responses:
        '201':
          description: User followed successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundError'
        '409':
          description: Already following
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserConflictError'
    delete:
      tags: [Users]
      summary: Unfollow a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                followingId:
                  type: integer
      responses:
        '204':
          description: Unfollowed successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundError'
  
  /api/users/auth/login:
    post:
      tags: [Users]
      summary: Login a user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: User logged in successfully
        '400':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUnauthorizedError'