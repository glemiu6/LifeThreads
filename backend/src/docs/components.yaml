components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        bio:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Thread:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: string
        visibility:
          type: boolean
        created_at:
          type: string
          format: date-time

    Entry:
      type: object
      properties:
        id:
          type: integer
        threadId:
          type: integer
        title:
          type: string
        body:
          type: string
        entry_date:
          type: string
          format: date-time
        location:
          type: string
          nullable: true
        is_published:
          type: boolean
        created_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: object
            properties:
              tag:
                type: object
                properties:
                  name:
                    type: string
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'

    Media:
      type: object
      properties:
        id:
          type: integer
        entryId:
          type: integer
        url:
          type: string
        type:
          type: string

    Comment:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        entryId:
          type: integer
        body:
          type: string
        created_at:
          type: string
          format: date-time
        author:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            avatar:
              type: string

    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [INVITE, COMMENT, REACT, FOLLOW]
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time