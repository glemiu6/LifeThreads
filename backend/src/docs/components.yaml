components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string

    # ---- Thread Errors ----
    ThreadValidationError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Validation failed"
            details:
              - "title: Minimum 3 characters"
              - "description: Required field"

    ThreadForbiddenError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Forbidden"
            details:
              - "You are not the owner of this thread"

    ThreadNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Not found"
            details:
              - "Thread with id 42 does not exist"

    ThreadConflictError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Conflict"
            details:
              - "User is already a member of this thread"

    # ---- Notification Errors ----
    NotificationValidationError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Validation failed"
            details:
              - "is_read: must be a boolean"

    NotificationNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Not found"
            details:
              - "User 42 doesn't have any notifications"

    # ---- User Errors ----
    UserValidationError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Validation failed"
            details:
              - "name: Minimum 2 characters"
              - "email: Invalid email"
              - "password: Minimum 4 characters"

    UserNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Not found"
            details:
              - "User with id 42 does not exist"

    UserConflictError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Conflict"
            details:
              - "User is already being followed"

    UserForbiddenError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Forbidden"
            details:
              - "You do not have permission to perform this action"
    

    EntryValidationError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Validation failed"
            details:
              - "title: Required field"
              - "body: Required field"

    EntryNotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - example:
            error: "Not found"
            details:
              - "Entry with id 42 does not exist"