paths:
  /api/threads:
    get:
      tags: [Threads]
      summary: List all threads for logged-in user
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Thread'

    post:
      tags: [Threads]
      summary: Create a new thread
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 20
                  example: Family Memories
                description:
                  type: string
                  example: Our family archive
      responses:
        201:
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        400:
          description: Validation error

  /api/threads/explore:
    get:
      tags: [Threads]
      summary: Explore all public threads (no auth required)
      responses:
        200:
          description: Public threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Thread'

  /api/threads/search:
    get:
      tags: [Threads]
      summary: Search public threads by title or description
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            example: family
      responses:
        200:
          description: Matching public threads

  /api/threads/summary:
    get:
      tags: [Threads, AI]
      summary: AI monthly summary of all entries in a month
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
            example: 2025
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 3
      responses:
        200:
          description: AI generated monthly summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                    example: March was a month full of family moments...
        503:
          description: LLM unavailable

  /api/threads/{id}:
    get:
      tags: [Threads]
      summary: Get thread details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Thread details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        403:
          description: Access denied
        404:
          description: Thread not found

    put:
      tags: [Threads]
      summary: Update thread title and description (owner only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
      responses:
        200:
          description: Updated thread
        403:
          description: Not the thread owner
        404:
          description: Thread not found

    delete:
      tags: [Threads]
      summary: Delete thread and all its data (owner only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Thread deleted
        403:
          description: Not the thread owner

  /api/threads/{id}/visibility:
    put:
      tags: [Threads]
      summary: Toggle thread visibility (owner only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility:
                  type: boolean
                  example: true
      responses:
        200:
          description: Updated thread
        403:
          description: Not the thread owner

  /api/threads/{id}/summary:
    get:
      tags: [Threads, AI]
      summary: AI narrative summary of all entries in this thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: AI generated summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
        403:
          description: Access denied
        404:
          description: Thread not found
        503:
          description: LLM unavailable

  /api/threads/{id}/entries:
    get:
      tags: [Threads]
      summary: List all entries in a thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'

    post:
      tags: [Threads]
      summary: Create a new entry in a thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title:
                  type: string
                  example: Sunday walk
                body:
                  type: string
                  example: Today I walked by the river...
                location:
                  type: string
                  example: Lisbon, Portugal
      responses:
        201:
          description: Entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'

  /api/threads/{id}/members:
    get:
      tags: [Threads]
      summary: List members of a thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Member list
        403:
          description: Access denied

    delete:
      tags: [Threads]
      summary: Leave a thread (remove yourself)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Left the thread
        403:
          description: Not a member

  /api/threads/{id}/members/{userId}:
    put:
      tags: [Threads]
      summary: Update a member's role (owner only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [ADMIN, COLLABORATOR, OBSERVER]
      responses:
        200:
          description: Role updated
        403:
          description: Not the thread owner

    delete:
      tags: [Threads]
      summary: Remove a member from thread (owner only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Member removed
        403:
          description: Not the thread owner

  /api/threads/{id}/invites:
    post:
      tags: [Threads]
      summary: Invite a user to a thread by email (owner only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, expires_at]
              properties:
                email:
                  type: string
                  format: email
                  example: friend@gmail.com
                expires_at:
                  type: string
                  format: date-time
                  example: '2026-12-31T23:59:59Z'
      responses:
        201:
          description: Invite created and email sent
        403:
          description: Not the thread owner

  /api/threads/invites/{id}/response:
    put:
      tags: [Threads]
      summary: Accept or decline an invite
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: string
                  enum: [ACCEPTED, DECLINE]
      responses:
        200:
          description: Invite response recorded
        400:
          description: Invite expired or already responded
        403:
          description: Invite not for this user