paths:
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Get all notifications for logged-in user
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

    post:
      tags: [Notifications]
      summary: Create a notification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, type]
              properties:
                userId:
                  type: integer
                type:
                  type: string
                  enum: [INVITE, COMMENT, REACT, FOLLOW]
      responses:
        201:
          description: Notification created

  /api/notifications/status:
    put:
      tags: [Notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        204:
          description: All marked as read

  /api/notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Delete a notification
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Notification deleted