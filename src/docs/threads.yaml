paths:
  /api/threads/explore:
    get:
      tags: [Threads]
      summary: Explore public threads
      responses:
        '200':
          description: List of public threads
        '404':
          description: No public threads found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNotFoundError'

  /api/threads/search:
    get:
      tags: [Threads]
      summary: Search public threads by query
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of threads matching the search query
        '400':
          description: Search query validation error

  /api/threads:
    post:
      tags: [Threads]
      summary: Create a new thread
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
              properties:
                title:
                  type: string
                  example: "My First Thread"
                  maxLength: 20
                  minLength: 3
                description:
                  type: string
                  example: "This is the description of my first thread."
      responses:
        '201':
          description: Thread created successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadValidationError'

    get:
      tags: [Threads]
      summary: List user threads
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of threads
        '401':
          description: Unauthorized

  /api/threads/{id}:
    get:
      tags: [Threads]
      summary: Get a thread by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thread found successfully
        '403':
          description: Access denied
        '404':
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNotFoundError'

    put:
      tags: [Threads]
      summary: Update a thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 20
                  minLength: 3
                description:
                  type: string
      responses:
        '200':
          description: Thread updated successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadValidationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadForbiddenError'
        '404':
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNotFoundError'

    delete:
      tags: [Threads]
      summary: Delete a thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Thread deleted successfully
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadForbiddenError'
        '404':
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNotFoundError'

  /api/threads/{id}/visibility:
    put:
      tags: [Threads]
      summary: Update thread visibility
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - visibility
              properties:
                visibility:
                  type: boolean
      responses:
        '200':
          description: Thread visibility updated successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadValidationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadForbiddenError'
        '404':
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNotFoundError'

  /api/threads/{id}/invite:
    post:
      tags: [Invites]
      summary: Invite a user to a thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - expires_at
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                expires_at:
                  type: string
                  format: date-time
                  example: "2026-06-01T00:00:00.000Z"
      responses:
        '201':
          description: Invite created successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadValidationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadForbiddenError'
        '404':
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNotFoundError'

  /api/threads/invites/{id}/respond:
    put:
      tags: [Invites]
      summary: Accept or decline an invite
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  type: string
                  enum: [ACCEPTED, DECLINE]
                  example: "ACCEPTED"
      responses:
        '200':
          description: Invite responded to successfully
        '400':
          description: Invite already responded to or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadValidationError'
        '403':
          description: Invite not for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadForbiddenError'
        '404':
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNotFoundError'

  /api/threads/{id}/members:
    get:
      tags: [Members]
      summary: List members of a thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of thread members
        '403':
          description: Access denied
        '404':
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNotFoundError'

  /api/threads/{id}/members/me:
    delete:
      tags: [Members]
      summary: Leave a thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Left thread successfully
        '403':
          description: Not a member of this thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadForbiddenError'
        '404':
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNotFoundError'

  /api/threads/{id}/members/{userId}:
    put:
      tags: [Members]
      summary: Update a member's role
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [ADMIN, COLLABORATOR, OBSERVER]
                  example: "COLLABORATOR"
      responses:
        '200':
          description: Member role updated successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadValidationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadForbiddenError'
        '404':
          description: Thread or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNotFoundError'

    delete:
      tags: [Members]
      summary: Remove a member from a thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Member removed successfully
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadForbiddenError'
        '404':
          description: Thread or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNotFoundError'