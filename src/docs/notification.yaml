paths:
  /api/notifications/{id}:
    put:
      tags: [Notifications]
      summary: Updates notification status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_read:
                  type: boolean
      responses:
        '204':
          description: Notification updated
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationValidationError'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationNotFoundError'

  /api/notifications/user/{userId}:
    get:
      tags: [Notifications]
      summary: Lists all notifications of a user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Found the notifications
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationValidationError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationNotFoundError'
  /api/notifications:
    post:
      tags: [Notifications]
      summary: Creates a new notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                type:
                  type: string
                  enum: [INVITE, COMMENT, REACT, FOLLOW]
      responses:
        '201':
          description: Notification created
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationValidationError'  